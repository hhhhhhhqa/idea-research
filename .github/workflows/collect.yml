name: Collect signals

on:
  schedule:
    - cron: "0 22 * * *" # 06:00 Asia/Hong_Kong
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Collect
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: ai-signal collect --strict
      - name: Prepare Agent contexts
        run: |
          ai-signal prepare --period daily
          ai-signal prepare --period weekly
      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds data/snapshots reports/contexts
          git diff --staged --quiet || git commit -m "data: refresh signals $(date -u +%F)"
          git push
