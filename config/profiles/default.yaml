name: AI 二级市场 idea generation
language: zh-CN
detail: standard
report_focus: >-
  由阅读 feed 的 Agent 判断与 AI、互联网、软件二级市场 idea generation 的相关性，
  Newsletter / X 必须进一步对应到具体上市公司并有明确 Long/Short 或偏多/偏空方向；
  只写原文支持的 2-4 个关键理由，不为了平衡观点额外寻找风险或反方材料；
  对符合条件的材料当天全量展示，
  不对来源或观点打分，也不把热度本身当作投资结论。

reddit_discussions:
  enabled: true
  subreddit: wallstreetbets
  max_symbols: 3
  max_hot_posts: 5
  min_mentions: 1
  # WSB gets a separate Hot top-five rollup, while the complete captured post set
  # remains available to the subscriber Agent in `wsb_posts`.
  rollup_only: true

# 这些主题只用于 Agent 的组织和用户偏好，不会从中央 feed 或 context 删除条目。

