name: AI 二级市场 idea generation
language: zh-CN
detail: standard
report_focus: >-
  展示 AI、互联网与软件二级市场相关来源在当日说了什么；
  不对来源或观点打分，也不把热度本身当作投资结论。

enabled_sources:
  - substack
  - rss
  - reddit
  - x
  - price

lookback_hours:
  daily: 36
  weekly: 192

reddit_discussions:
  enabled: true
  subreddit: wallstreetbets
  max_symbols: 3
  max_hot_posts: 3
  min_mentions: 1
  # WSB is summarized as a separate attention signal instead of competing with
  # research articles for the main report's limited item slots.
  rollup_only: true

# 留空表示不过滤；填入后，非价格内容至少命中一个词才进入上下文。
include_keywords: []
exclude_keywords:
  - giveaway
  - meme

themes:
  模型能力与成本:
    - benchmark
    - inference
    - training
    - token
    - quantization
    - 推理
    - 训练
    - 量化
  AI 基础设施:
    - gpu
    - datacenter
    - data center
    - capex
    - hbm
    - networking
    - 数据中心
    - 算力
  Agent 与软件:
    - agent
    - coding
    - copilot
    - workflow
    - seat
    - developer
    - 智能体
  开源生态:
    - open source
    - open-source
    - llama
    - hugging face
    - 开源
  商业化与需求:
    - revenue
    - pricing
    - customer
    - enterprise
    - adoption
    - monetization
    - 商业化
    - 客户

watchlist:
  - ticker: NVDA
    name: NVIDIA
    aliases: [英伟达, CUDA, Blackwell, GB200, GB300]
  - ticker: MSFT
    name: Microsoft
    aliases: [微软, Azure, Copilot]
  - ticker: GOOGL
    name: Alphabet
    aliases: [Google, 谷歌, Gemini, DeepMind, TPU]
  - ticker: META
    name: Meta Platforms
    aliases: [Meta, Llama]
  - ticker: AMZN
    name: Amazon
    aliases: [AWS, Bedrock, Trainium, Inferentia]
  - ticker: ORCL
    name: Oracle
    aliases: [OCI, Oracle Cloud]
  - ticker: TSM
    name: TSMC
    aliases: [台积电, CoWoS]
  - ticker: ASML
    name: ASML
    aliases: [EUV, 阿斯麦]
  - ticker: 2513.HK
    name: Zhipu AI
    aliases: [智谱, GLM]
