name: AI 二级市场 idea generation
language: zh-CN
detail: standard
report_focus: >-
  第一章为交易 Idea：Newsletter / X / WSB / 收盘异动都必须对应明确公司和鲜明 Long/Short 或偏多/偏空观点；
  原文理由有多少写多少，没有理由也不补；第二章产业变化读取已配置的 AI 研究人员和产业研究来源；
  对符合条件的材料当天全量展示，
  不对来源或观点打分，也不把热度本身当作投资结论。

reddit_discussions:
  enabled: true
  subreddit: wallstreetbets
  listing: dd
  flair: DD
  sort: top
  time_filter: day
  max_dd_posts: 10
  additional_subreddits:
    - subreddit: SecurityAnalysis
      listing: thesis
      flairs: [Thesis, Short Thesis]
      max_posts: 10
  # WSB and SecurityAnalysis get separate Reddit rollups; every qualifying
  # post remains available to the subscriber Agent in the prepared context.
  rollup_only: true

# 这些主题只用于 Agent 的组织和用户偏好，不会从中央 feed 或 context 删除条目。

themes:
  模型能力与成本:
    - benchmark
    - inference
    - training
    - token
    - quantization
    - 推理
    - 训练
    - 量化
  AI 基础设施:
    - gpu
    - datacenter
    - data center
    - capex
    - hbm
    - networking
    - 数据中心
    - 算力
  Agent 与软件:
