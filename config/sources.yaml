reddit:
  section: transaction_ideas
  lookback_hours: 24
  max_items_per_subreddit: 100
  anonymous_request_delay_seconds: 12.0
  # Keep WallStreetBets DD (Due Diligence) daily Top posts and save image attachments.
  download_images: true
  media_dir: data/media/reddit
  max_images_per_post: 4
  max_image_bytes: 5000000
  subreddits:
    - name: wallstreetbets
      listing: dd
      flair: DD
      sort: top
      time_filter: day
      # Reddit's daily Top search is ranked by the subreddit, not by our
      # collector. Capture up to the first twenty returned positions.
      limit: 20
      lookback_hours:
    - name: SecurityAnalysis
      listing: thesis
      flairs:
        - Thesis
        - Short Thesis
      sort: top
      time_filter: day
      # Combined daily Top ranking across the Thesis and Short Thesis flairs.
      limit: 10
      lookback_hours:

  # Bare uppercase words are accepted only from this allowlist. Unknown cashtags such
  # as $XYZ are still captured, which keeps discovery open without turning every
  # acronym in a post into a stock ticker.
  known_tickers:
    - NVDA
    - MSFT
    - GOOGL
    - META
    - AMZN
    - ORCL
    - TSM
    - ASML
    - TSLA
    - AAPL
    - AMD
    - AVGO
    - PLTR
    - GME
    - AMC
    - RDDT
    - HOOD
    - COIN
    - MSTR
    - SOFI
    - SMCI
    - CRWV
    - NBIS
    - IREN
    - OPEN
    - NFLX
    - SHOP
    - SNOW
    - CRM
    - DDOG
    - NET
    - CRWD
    - RBRK
  ticker_aliases:
    NVDA: [NVIDIA]
    MSFT: [Microsoft]
    GOOGL: [Google, Alphabet]
    META: [Meta Platforms, Facebook]
    AMZN: [Amazon, AWS]
    ORCL: [Oracle]
    TSM: [TSMC]
    ASML: [ASML]
    TSLA: [Tesla]
    AAPL: [Apple]
    AMD: [Advanced Micro Devices]
    AVGO: [Broadcom]
    PLTR: [Palantir]
    GME: [GameStop]
    AMC: [AMC Entertainment]
    # Do not alias the word "Reddit" to RDDT: it appears in feed boilerplate and
    # would create false mentions. Explicit RDDT or $RDDT still works.
    HOOD: [Robinhood]
    COIN: [Coinbase]
    MSTR: [MicroStrategy]
    SOFI: [SoFi]
    SMCI: [Super Micro]
    CRWV: [CoreWeave]
    NBIS: [Nebius]
    NFLX: [Netflix]
    SHOP: [Shopify]
    SNOW: [Snowflake]
    CRM: [Salesforce]
    NOW: [ServiceNow]
    DDOG: [Datadog]
    NET: [Cloudflare]
    CRWD: [CrowdStrike]
    RBRK: [Rubrik]

x:
  section: transaction_ideas
  # X is a same-calendar-day source in the user's timezone, not a rolling 72h feed.
  same_day: true
  timezone: Asia/Hong_Kong
  lookback_hours: 24
  retention_days: 3
  # One twscrape session may be rate-limited by SearchTimeline. Keep waiting for
  # the server reset, then resume the next account; transaction ideas are ordered first.
  cooldown_poll_seconds: 5
  search_limit_per_account: 300
  include_replies: false
  linked_articles:
    enabled: true
    max_body_chars: 12000
    max_download_bytes: 1000000
  # Optional floor on likes + 2*reposts + replies for a tweet to be kept.
  # min_engagement: 10
  # `include_replies` can be overridden for an individual account.
  accounts:
    # Buy-side / institutional viewpoints
    - handle: GavinSBaker
      name: Gavin Baker
      investor_type: buy_side_cio
      coverage: AI compute, NVDA, TSLA, cloud infrastructure, technology capex
      evidence_note: Long-term technology investor; may discuss own holdings and has a structural growth bias.
    - handle: jaminball
      name: Jamin Ball
      investor_type: buy_side_partner
      coverage: enterprise software, SaaS valuation, AI applications
      evidence_note: Read alongside Clouded Judgement; useful for software demand and valuation framing.
    - handle: altcap
      name: Brad Gerstner
      investor_type: buy_side_founder
      coverage: META, UBER, NVDA, AI capex, large internet platforms
      evidence_note: Portfolio-manager perspective; can be talking the book.
    - handle: ShanuMathew93
      name: Shanu Mathew
      investor_type: public_markets_pm
      coverage: AI datacenters, power, infrastructure
      evidence_note: Use for AI infrastructure constraints rather than pure software analysis.

    # Company, product, and business-model analysis
    - handle: StackInvesting
      name: Peter Offringa
      investor_type: software_investor
      coverage: software product competition, earnings, portfolio logic
    - handle: hhhypergrowth
      name: Muji
      investor_type: software_operator_investor
      coverage: NET, DDOG, SNOW, CRWD, ZS, RDDT
      evidence_note: Product and earnings commentary; some long-form work is paid.
    - handle: eric_seufert
      name: Eric Seufert
      investor_type: operator_analyst
      coverage: META, GOOGL, APP, TTD, Apple, digital advertising
      include_replies: true
      evidence_note: Replies are intentionally included because they often contain industry corrections and debate.
    - handle: modestproposal1
      name: Modest Proposal
      investor_type: anonymous_market_commentator
      coverage: large internet, software expectations, crowding, earnings expectation gaps
      evidence_note: Discovery signal for market debate only; anonymous identity means it cannot be final factual evidence.
